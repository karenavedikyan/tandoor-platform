name: DB source of truth lint

on:
  pull_request:
    paths:
      - "apps/platform/client/src/**"
      - "scripts/lint-db-source-of-truth.mjs"

jobs:
  lint-db-source-of-truth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: lint:db-source-of-truth
        run: node scripts/lint-db-source-of-truth.mjs
